		<script>
			let mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
			mediaQuery.addEventListener('change', () => {
				mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
			});

			const br = document.body.getBoundingClientRect();
			const dr = dvd.getBoundingClientRect();
			console.log(br, dr);

			let dx = 2 * Math.round(Math.random()) - 1;
			let dy = 2 * Math.round(Math.random()) - 1;

			// Based on the finest source: https://wiki.tcl-lang.org/page/DVD+Logo+Screensaver
			const colors = ['currentColor', 'purple', 'red', 'orange', 'magenta', 'yellow', 'green', 'blue', 'cyan'];

			let ci = 0;

			let prev = null;

			!mediaQuery.matches && requestAnimationFrame(function draw(ts) {
				if (prev === null) {
					prev = ts;
					return requestAnimationFrame(draw);
				}
				const dt = ts - prev;
				prev = ts;

				const br = document.body.getBoundingClientRect();
				const dr = dvd.getBoundingClientRect();
				const speed = Math.min(br.width, br.height) / 10;


				let nx = dr.x + dx * dt/1000 * speed;
				let ny = dr.y + dy * dt/1000 * speed;

				if (nx < 0)                   { ci = (ci+1) % colors.length; dx = -dx; nx = 0; }
				if (ny < 0)                   { ci = (ci+1) % colors.length; dy = -dy; ny = 0;  }
				if (nx+dr.width  > br.width)  { ci = (ci+1) % colors.length; dx = -dx; nx = br.width - dr.width;  }
				if (ny+dr.height > br.height) { ci = (ci+1) % colors.length; dy = -dy; ny = br.height - dr.height; }

				const x = nx + dr.width/2 - br.width/2;
				const y = ny + dr.height/2 - br.height/2;

				dvd.style.color = colors[ci];
				dvd.style.transform = `translate(-50%, -50%) translate(${x / br.width * 100}vw, ${y / br.height * 100}vh)`;

				!mediaQuery.matches && requestAnimationFrame(draw);
			});

		</script>
